        initial: "O",
        deliverables: [

        ]
      },
      {

      {

        coverImage: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80",

        initial: "L",
        deliverables: [
          { title: "Google Business Profile Tuning", desc: "Categories, geotagged photos & weekly posts" },
          { title: "Local Citation Building (NAP)", desc: "Consistent Name-Address-Phone on 80+ directories" },
          { title: "Review Velocity Campaigns", desc: "Automated review acquisition & positive feedback" },
          { title: "Geo-Grid Rank Tracking", desc: "Mile-by-mile ranking heatmaps across your city" }
        ]
      },
      {
        id: "guest-posting",
        name: "High-DR Guest Posting Networks",
        shortTitle: "Guest Posting",
        category: "Publisher Placements",
        tagline: "Curated verified publisher placements on genuine authority media domains.",
        stat: "DR 60–92 Sites",
        price: "₹14,999",
        coverImage: "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&w=1200&q=80",
        glow: "232, 121, 249",
        initial: "H",
        deliverables: [
          { title: "Real Editorial Outlets", desc: "Manual pitching to real webmasters with traffic" },
          { title: "Native Editorial Integration", desc: "Contextual mentions that Google rewards" },
          { title: "Dofollow Link Guarantee", desc: "Permanent do-follow links that pass PageRank" },
          { title: "Replacement Guarantee", desc: "Free replacement if any link drops within 365 days" }
        ]
      },
      {
        id: "about",
        name: "Brand Digital PR & Authority",
        shortTitle: "Digital PR",
        category: "Reputation & Brand Visibility",
        tagline: "Syndicated press releases & tier-1 editorial publication features.",
        stat: "Tier 1 Media",
        price: "₹39,999",
        coverImage: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=1200&q=80",
        glow: "248, 113, 113",
        initial: "R",
        deliverables: [
          { title: "Press Release Crafting", desc: "Journalist-ready AP-style brand storytelling" },
          { title: "Syndicated Wire Distribution", desc: "Guaranteed publication on 150+ news sites" },
          { title: "Executive Thought Leadership", desc: "Founder quotes and authoritative industry commentary" },
          { title: "Full Coverage Clipping Book", desc: "White-label PDF report of all live features" }
        ]
      }
    ];

    let pos = 0;
    let target = 0;
    let flipped = null;
    let flipK = 0;
    let W = 380;
    let isDragging = false;
    let startX = 0;
    let startPos = 0;
    let lastX = 0;
    let lastTime = 0;
    let velocity = 0;
    let moved = false;
    let clickedCoverIdx = null;

    const flowEl = document.getElementById("flow");
    const letterEl = document.getElementById("letter");
    const npTitle = document.getElementById("np-title");
    const npArtist = document.getElementById("np-artist");
    const npBtn = document.getElementById("np-btn");
    const npFlip = document.getElementById("np-flip");
    const azEl = document.getElementById("az");
    const glowEl = document.getElementById("glow");

    function computeW() {
      const vh = window.innerHeight;
      const vw = window.innerWidth;
      W = Math.round(Math.min(vh * 0.36, vw * 0.34, 420));
      W = Math.max(260, W);
      document.documentElement.style.setProperty("--w", W + "px");
      flowEl.style.perspective = (W * 3.4) + "px";
    }

    computeW();
    window.addEventListener("resize", computeW);

    // Build covers in DOM
    SERVICES.forEach((s, i) => {
      const cv = document.createElement("div");
      cv.className = "cv";
      cv.dataset.index = i;

      cv.innerHTML = `
        <div class="f">
          <img src="${s.coverImage}" alt="${s.name}" loading="${i <= 2 ? 'eager' : 'lazy'}" />
          <div class="overlay"></div>
          <div class="badge">${s.stat}</div>
          <div class="content">
            <div class="category">${s.category}</div>
            <div class="title">${s.name}</div>
            <div class="action">
              <span>Click for full details</span>
              <span>${s.price}</span>
            </div>
          </div>
        </div>
        <div class="r">
          <img src="${s.coverImage}" alt="" />
        </div>
        <div class="bk">
          <div class="hd">
            <div>
              <div class="t">${s.name}</div>
              <div class="a">${s.category}</div>
            </div>
            <a href="/services/${s.id}" style="color:#2563eb;font-weight:700;font-size:12px;text-decoration:none;background:#fff;padding:4px 10px;border-radius:20px;">Open Page ↗</a>
          </div>
          <ul>
            ${s.deliverables.map((d, dIdx) => `
              <li class="${dIdx === 0 ? 'hi' : ''}" onclick="window.location.href='/services/${s.id}'">
                <span>${d.title}</span>
                <span style="font-size:11px;font-weight:400">${d.desc}</span>
              </li>
            `).join("")}
          </ul>
        </div>
      `;

      flowEl.appendChild(cv);
    });

    const coverNodes = flowEl.querySelectorAll(".cv");

    // Build A-Z grid
    const letters = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];
    letters.forEach(char => {
      const btn = document.createElement("button");
      btn.textContent = char;
      const has = char === "#" || SERVICES.some(s => s.name.toUpperCase().startsWith(char) || s.shortTitle.toUpperCase().startsWith(char));
      if (!has) {
        btn.disabled = true;
      }
      btn.onclick = () => {
        flipped = null;
        if (char === "#") {
          target = 0;
          return;
        }
        const idx = SERVICES.findIndex(s => s.name.toUpperCase().startsWith(char) || s.shortTitle.toUpperCase().startsWith(char));
        if (idx !== -1) target = idx;
      };
      azEl.appendChild(btn);
    });

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    // Input: Wheel
    let wheelAccum = 0;
    window.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      wheelAccum += delta;
      if (Math.abs(wheelAccum) >= 60) {
        const step = Math.sign(wheelAccum);
        target = Math.max(0, Math.min(SERVICES.length - 1, target + step));
        wheelAccum = 0;
        flipped = null;
      }
    }, { passive: false });

    // Drag / Touch
    flowEl.addEventListener("pointerdown", (e) => {
      flowEl.setPointerCapture(e.pointerId);
      isDragging = true;
      startX = e.clientX;
      startPos = pos;
      lastX = e.clientX;
      lastTime = performance.now();
      velocity = 0;
      moved = false;

      const c = e.target.closest(".cv");
      clickedCoverIdx = c ? parseInt(c.dataset.index, 10) : null;
    });

    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;

      const now = performance.now();
      const dt = Math.max(1, now - lastTime);
      velocity = (e.clientX - lastX) / dt;
      lastX = e.clientX;
      lastTime = now;

      if (moved) {
        const STEP = 0.2;
        pos = Math.max(-0.4, Math.min(SERVICES.length - 0.6, startPos - dx / (W * STEP * 2.2)));
        flipped = null;
      }
    });

    window.addEventListener("pointerup", (e) => {
      if (!isDragging) return;
      isDragging = false;

      if (moved) {
        target = Math.max(0, Math.min(SERVICES.length - 1, Math.round(pos - velocity * 40)));
      } else if (clickedCoverIdx !== null) {
        const center = Math.round(target);
        if (clickedCoverIdx !== center) {
          target = clickedCoverIdx;
          flipped = null;
        } else {
          // Open detail page on centre cover click!
          window.location.href = `/services/${SERVICES[clickedCoverIdx].id}`;
        }
      }
    });

    // Keyboard
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        target = Math.min(SERVICES.length - 1, target + 1);
        flipped = null;
      } else if (e.key === "ArrowLeft") {
        target = Math.max(0, target - 1);
        flipped = null;
      } else if (e.key === "Enter") {
        const center = Math.round(target);
        window.location.href = `/services/${SERVICES[center].id}`;
      } else if (e.key === "Escape") {
        flipped = null;
      }
    });

    npFlip.onclick = () => {
      const center = Math.round(target);
      if (flipped === center) flipped = null;
      else flipped = center;
    };

    // Frame Loop
    let lastT = performance.now();
    function animate(now) {
      const dt = Math.min((now - lastT) / 1000, 0.05);
      lastT = now;

      if (!isDragging) {
        const diff = target - pos;
        if (Math.abs(diff) > 0.0005) {
          pos += diff * (1 - Math.exp(-dt * 13));
        } else {
          pos = target;
        }
      }

      if (flipped !== null && flipK < 1) {
        flipK = Math.min(1, flipK + dt / 0.62);
      } else if (flipped === null && flipK > 0) {
        flipK = Math.max(0, flipK - dt / 0.45);
      }

      const ANG = 72;
      const GAP = 0.62;
      const STEP = 0.2;
      const DEPTH = 0.42;

      coverNodes.forEach((node, i) => {
        const d = i - pos;
        const a = Math.abs(d);
        const s = Math.sign(d);

        if (a > 9) {
          node.style.display = "none";
          return;
        }
        node.style.display = "block";

        let x = 0;
        let rot = 0;
        let z = 0;

        if (a < 1) {
          x = d * GAP * W;
          rot = -d * ANG;
          z = -a * DEPTH * W;
        } else {
          x = s * (GAP + (a - 1) * STEP) * W;
          rot = -s * ANG;
          z = -DEPTH * W;
        }

        const isFlipped = flipped === i;
        let extraRot = 0;
        let extraZ = 0;
        if (isFlipped || (flipped === null && flipK > 0 && node.classList.contains("flip"))) {
          const e = easeInOutQuad(flipK);
          extraRot = e * 180;
          extraZ = Math.sin(Math.min(1, flipK * 1.4) * (Math.PI / 2)) * 0.55 * W;
        }

        if (isFlipped) node.classList.add("flip");
        else if (flipK === 0) node.classList.remove("flip");

        const zIdx = isFlipped ? 999 : 500 - Math.round(a * 10);
        node.style.zIndex = zIdx;
        node.style.transform = `translate3d(${x}px, 0, ${z + extraZ}px) rotateY(${rot + extraRot}deg)`;
      });

      // Update Active Service UI
      const centerIdx = Math.max(0, Math.min(SERVICES.length - 1, Math.round(pos)));
      const cur = SERVICES[centerIdx];

      letterEl.textContent = cur.initial;
      letterEl.style.opacity = flipped !== null ? "0" : "1";

      npTitle.textContent = cur.name;
      npTitle.href = `/services/${cur.id}`;
      npArtist.textContent = `${cur.category} • ${cur.stat}`;
      npBtn.href = `/services/${cur.id}`;
      npFlip.textContent = flipped === centerIdx ? "Close Scope ↺" : "Flip to Scope 🔄";

      glowEl.style.background = `radial-gradient(closest-side, rgba(${cur.glow}, 0.35), rgba(${cur.glow}, 0.08) 55%, transparent)`;

      // A-Z highlight
      const activeChar = cur.initial.toUpperCase();
      azEl.querySelectorAll("button").forEach(btn => {
        if (btn.textContent === activeChar) btn.classList.add("active");
        else btn.classList.remove("active");
      });

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
