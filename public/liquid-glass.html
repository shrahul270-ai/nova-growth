<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equilibrium — Live Better, Feel Whole Every Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }

      .liquid-glass {
        background: rgba(255, 255, 255, 0.01);
        background-blend-mode: luminosity;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: none;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        position: relative;
        overflow: hidden;
      }

      .liquid-glass::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.4px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0.15) 20%,
          rgba(255, 255, 255, 0) 40%,
          rgba(255, 255, 255, 0) 60%,
          rgba(255, 255, 255, 0.15) 80%,
          rgba(255, 255, 255, 0.45) 100%
        );
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-black text-white selection:bg-white selection:text-black">
    <div class="relative w-full h-screen overflow-hidden">
      <!-- Background Video -->
      <video
        class="absolute inset-0 w-full h-full object-cover pointer-events-none"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260511_230229_7c9bc431-46cf-489a-948d-e8144d8eb5d4.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>

      <!-- Navbar -->
      <header class="absolute top-0 left-0 right-0 z-20 flex items-center justify-between px-5 sm:px-8 py-5">
        <!-- Logo -->
        <div class="flex items-center gap-2 text-white font-medium text-base">
          <svg class="w-[22px] h-[22px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 12c-2-2.5-4-4-6.5-4a4.5 4.5 0 100 9c2.5 0 4.5-1.5 6.5-4zm0 0c2 2.5 4 4 6.5 4a4.5 4.5 0 100-9c-2.5 0-4.5 1.5-6.5 4z" />
          </svg>
          <span>Equilibrium</span>
        </div>

        <!-- Center Nav Pill (Desktop) -->
        <nav class="hidden md:flex liquid-glass items-center gap-1 rounded-xl px-2 py-2">
          <button class="flex items-center gap-0.5 px-3 py-1.5 rounded-md text-sm transition-colors bg-white/15 text-white">Home</button>
          <button class="flex items-center gap-0.5 px-3 py-1.5 rounded-md text-sm transition-colors text-white/70 hover:text-white">
            <span>Wellness</span>
            <svg class="w-[13px] h-[13px] mt-px" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
          </button>
          <button class="flex items-center gap-0.5 px-3 py-1.5 rounded-md text-sm transition-colors text-white/70 hover:text-white">Routine</button>
          <button class="flex items-center gap-0.5 px-3 py-1.5 rounded-md text-sm transition-colors text-white/70 hover:text-white">Our Team</button>
        </nav>

        <!-- Right CTAs (Desktop) -->
        <div class="hidden md:flex items-center gap-3">
          <button class="liquid-glass text-white text-sm font-medium px-4 py-2.5 rounded-full hover:bg-white/5 transition-colors">Log in</button>
          <button class="bg-white text-black text-sm font-medium px-4 py-2.5 rounded-full hover:bg-white/90 transition-colors">Begin Now</button>
        </div>

        <!-- Mobile Toggle Button -->
        <button id="menu-btn" class="md:hidden liquid-glass text-white p-2 rounded-lg cursor-pointer">
          <svg id="menu-icon" class="w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"/></svg>
          <svg id="close-icon" class="w-[18px] h-[18px] hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </header>

      <!-- Mobile Menu Overlay -->
      <div id="mobile-menu" class="hidden absolute top-[72px] left-4 right-4 z-30 md:hidden liquid-glass rounded-2xl p-4 flex-col gap-1">
        <button class="flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm bg-white/15 text-white">Home</button>
        <button class="flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm text-white/70 hover:text-white">
          <span>Wellness</span>
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
        </button>
        <button class="flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm text-white/70 hover:text-white">Routine</button>
        <button class="flex items-center justify-between w-full px-4 py-3 rounded-lg text-sm text-white/70 hover:text-white">Our Team</button>
        <div class="flex gap-2 mt-2 pt-3 border-t border-white/10">
          <button class="flex-1 liquid-glass text-white text-sm font-medium py-2.5 rounded-full text-center">Log in</button>
          <button class="flex-1 bg-white text-black text-sm font-medium py-2.5 rounded-full text-center">Begin Now</button>
        </div>
      </div>

      <!-- Hero Content (Bottom-Left) -->
      <div class="absolute bottom-0 left-0 z-20 px-6 sm:px-12 pb-10 sm:pb-16 max-w-2xl">
        <h1 class="text-white text-4xl sm:text-5xl lg:text-6xl font-medium leading-tight tracking-tight mb-4">
          Live Better, Feel Whole Every Day
        </h1>
        <p class="text-white/60 text-sm leading-relaxed mb-7 max-w-md font-normal">
          Take charge of how you feel with a companion built for your journey—build routines, follow your growth, and unlock tailored insights for a steadier, more vibrant life each day.
        </p>
        <div class="flex flex-wrap items-center gap-3">
          <button class="bg-white text-black text-sm sm:text-base font-medium px-6 sm:px-7 py-3 rounded-full hover:bg-white/90 transition-colors cursor-pointer">
            Start Today
          </button>
          <button class="liquid-glass text-white text-sm sm:text-base font-medium px-6 sm:px-7 py-3 rounded-full hover:bg-white/5 transition-colors cursor-pointer">
            Discover How
          </button>
        </div>
      </div>
    </div>

    <script>
      const btn = document.getElementById('menu-btn');
      const menu = document.getElementById('mobile-menu');
      const iconM = document.getElementById('menu-icon');
      const iconC = document.getElementById('close-icon');
      let open = false;

      if (btn && menu) {
        btn.addEventListener('click', () => {
          open = !open;
          if (open) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            iconM.classList.add('hidden');
            iconC.classList.remove('hidden');
          } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            iconM.classList.remove('hidden');
            iconC.classList.add('hidden');
          }
        });
      }
    </script>
  </body>
</html>
