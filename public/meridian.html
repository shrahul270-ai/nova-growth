<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020816" />
    <title>Meridian — Move payments forward together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <script>
      (function(){
        var cl = document.documentElement.classList;
        cl.add('js');
        var u = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
        document.documentElement.style.setProperty('--u', u);
        document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'animate' in document.documentElement) {
          cl.add('intro');
          setTimeout(function(){ cl.remove('intro'); }, 4000);
        }
      })();
    </script>
    <style>
      :root{
        --ink-bg:#020816; --glass:rgba(51,52,74,.6); --glass-blur:14px; --navy:rgba(45,56,92,.85);
        --peach:#f2b380; --cta:#f93f28; --peach-ink:#331200; --white:#ffffff; --display:#f6f8fc;
        --body:#cfd3e0; --chip:#c9ccd4; --rail:#989eac; --u:1; --vh:100vh; --cap-shift:-0.055em;
        --f-display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        --f-sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        --f-mono:"Space Mono",monospace;
      }
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0; height:100%; background:#020816; color:#fff; -webkit-text-size-adjust:100%}
      body{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:geometricPrecision; font-family:var(--f-sans)}
      a{color:inherit; text-decoration:none}
      :focus-visible{outline:2px solid #f2b380; outline-offset:3px}

      .hero{
        position:relative; width:100%; height:100vh; height:100dvh; height:var(--vh);
        min-height:100%; overflow:hidden; background:#020816; isolation:isolate;
      }
      .photo{
        position:absolute; left:0; top:0; width:100%; height:100%; z-index:0;
        will-change:transform; transform-origin:0 0;
      }
      .photo video{
        position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
        object-position:50% 100%; display:block; user-select:none;
      }
      .photo::after{
        content:""; position:absolute; inset:-1px; pointer-events:none;
        background:linear-gradient(180deg, rgba(2,8,22,1) 0%, rgba(2,8,22,.55) 6%, rgba(2,8,22,.15) 14%, rgba(2,8,22,0) 22%, rgba(2,8,22,0) 100%);
      }

      .nav-l,.nav-r{position:absolute; top:0; z-index:3; width:0; height:0}
      .nav-l{left:0; transform-origin:0 0; transform:scale(var(--u))}
      .nav-r{right:0; transform-origin:100% 0; transform:scale(var(--u))}

      a.brand{
        position:absolute; left:16px; top:29.3px; display:flex; align-items:flex-start;
        white-space:nowrap; cursor:pointer;
      }
      .brand svg{width:24px; height:24px; overflow:visible}
      .brand span{
        font-family:var(--f-sans); font-size:21px; letter-spacing:-0.1px; line-height:1;
        margin-left:4px; position:relative; left:var(--nx,-0.5px); top:var(--ny,-2.75px);
      }

      button.more{
        position:absolute; right:29.65px; top:23.83px; width:80.45px; height:35.35px;
        display:flex; align-items:center; padding:0 14.76px 0 15.14px;
        background:rgba(51,52,74,.6); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
        border:none; color:#fff; white-space:nowrap; cursor:pointer;
        transition:background-color .2s;
      }
      button.more:hover{background:rgba(66,66,96,.66)}
      button.more svg{width:8.4px; height:8.4px; fill:#fff; transform:translateY(0.31px)}
      button.more span{
        font-family:var(--f-mono); font-weight:700; font-size:12px; letter-spacing:0.2px; line-height:1;
        margin-left:13.4px; position:relative; left:var(--nx,0.25px); top:calc(var(--ny,-1px) + var(--cap-shift));
      }

      span.rail{
        position:absolute; right:8.7px; top:11.9px; width:1.9px; height:47.2px;
        background:#989eac; border-radius:1px; pointer-events:none; transform-origin:50% 0;
      }

      .stage{
        position:absolute; left:50%; top:0; width:1280px; height:800px; z-index:2;
        transform-origin:50% 0; transform:translateX(-50%) scale(var(--u));
      }

      a.pill{
        position:absolute; left:506px; top:99.76px; height:35.3px; display:flex; align-items:center;
        padding:0 11.78px 0 11.92px; background:rgba(51,52,74,.6); -webkit-backdrop-filter:blur(14px);
        backdrop-filter:blur(14px); white-space:nowrap; transition:background-color .2s; cursor:pointer;
      }
      a.pill:hover{background:rgba(66,66,96,.66)}
      a.pill .sq{display:inline-block; width:9.3px; height:11.1px; background:#c9ccd4; position:relative; top:0.1px}
      a.pill span{
        font-family:var(--f-mono); font-weight:700; font-size:12px; letter-spacing:0.6px; line-height:1;
        margin-left:18.3px; position:relative; left:var(--nx,0.75px); top:calc(var(--ny,0px) + var(--cap-shift));
      }
      a.pill svg{margin-left:13.5px; position:relative; top:0.15px}

      h1{
        position:absolute; left:0; top:0; width:1280px; margin:0; text-align:center;
        white-space:nowrap; font-family:var(--f-display); font-weight:400; font-size:53px;
        line-height:1; color:#f6f8fc; transform:translate(var(--nx,-3px),var(--ny,159.5px));
      }

      p.lede{
        position:absolute; left:0; top:0; width:1280px; margin:0; text-align:center;
        font-family:var(--f-sans); font-size:18px; line-height:23px; color:#cfd3e0;
        transform:translate(var(--nx,-3px),var(--ny,236.5px));
      }
      br.d{display:inline}

      .cta{position:absolute; left:441.1px; top:326.55px; display:flex; gap:8.76px}
      .btn{
        height:51.2px; display:inline-flex; align-items:center; white-space:nowrap;
        font-family:var(--f-mono); font-weight:700; font-size:13.5px; letter-spacing:0.4px; line-height:1;
        transition:filter .2s, background-color .2s; border:none; cursor:pointer;
      }
      .btn span{position:relative; left:var(--nx,0px); top:calc(var(--ny,0px) + var(--cap-shift))}
      .b1{padding:0 30.35px; background:rgba(45,56,92,.85); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); color:#fff}
      .b1:hover{background:rgba(58,72,114,.9)}
      .b2{padding:0 25.92px 0 25.78px; background:#f93f28; color:#331200}
      .b2:hover{filter:brightness(1.05)}
      .b2 svg{margin-right:22.5px; position:relative; top:0.34px}

      @media (max-width:1151.98px){
        .hero{height:auto; min-height:var(--vh); min-height:100svh}
        .nav-l,.nav-r{transform:scale(.88)}
        .stage{
          position:relative; left:auto; top:auto; width:auto; height:auto; transform:none;
          display:flex; flex-direction:column; align-items:center; text-align:center;
          padding:clamp(80px,12vh,110px) 24px 60px;
        }
        a.pill{position:relative; left:auto; top:auto}
        h1{position:relative; width:auto; transform:none; white-space:normal; font-size:clamp(36px,7vw,48px); margin-top:20px}
        p.lede{position:relative; width:auto; transform:none; font-size:16px; line-height:1.4; margin-top:16px; max-w:28em}
        br.d{display:none}
        .cta{position:relative; left:auto; top:auto; margin-top:24px; flex-wrap:wrap; justify-content:center}
      }
    </style>
  </head>
  <body>
    <section class="hero" id="hero" aria-label="Meridian">
      <!-- Photo Layer -->
      <div class="photo" id="photo" aria-hidden="true">
        <video autoplay muted loop playsinline preload="auto" width="1586" height="992"
               poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/19548534-c502-431f-904d-24d31b17c471.jpg"
               src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/0e1b18f2-b590-4b97-96f0-b05e019d07eb.mp4"></video>
      </div>

      <!-- Nav Left -->
      <div class="nav-l">
        <a class="brand" href="/pay" aria-label="Meridian home">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff">
            <circle cx="12.2" cy="11.9" r="8.45" stroke-width="2"/>
            <path d="M12.2 0.1V24" stroke-width="1.9"/>
            <path d="M0 11.9H24.4" stroke-width="1.95"/>
          </svg>
          <span>meridian</span>
        </a>
      </div>

      <!-- Nav Right -->
      <div class="nav-r">
        <button class="more" aria-haspopup="true">
          <svg viewBox="0 0 8.4 8.4" class="dots">
            <rect x="0" y="0" width="2.4" height="2.4"/>
            <rect x="6" y="0" width="2.4" height="2.4"/>
            <rect x="0" y="6" width="2.4" height="2.4"/>
            <rect x="6" y="6" width="2.4" height="2.4"/>
          </svg>
          <span>MORE</span>
        </button>
        <span class="rail" aria-hidden="true"></span>
      </div>

      <!-- Stage -->
      <main class="stage" id="stage">
        <a class="pill" href="#work">
          <i class="sq"></i>
          <span>VIEW OUR MERIDIAN* WORK</span>
          <svg width="11" height="10.5" viewBox="0 0 11 10.5" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M1 0.9l4.2 4.35L1 9.6"/>
            <path d="M6.2 0.9l4.2 4.35L6.2 9.6"/>
          </svg>
        </a>

        <h1>Move payments forward together</h1>

        <p class="lede">
          Smart reports from teams using Meridian to manage spending,<br class="d">
          issue cards, and stay in control as they grow. Accounts stay<br class="d">
          secure, orderly, and dependable.
        </p>

        <div class="cta" id="cta">
          <a class="btn b1" href="#demo"><span>SEE IT HAPPEN</span></a>
          <a class="btn b2" href="#contact">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.05">
              <circle cx="2.3" cy="2.3" r="1.75"/>
              <circle cx="9.7" cy="2.3" r="1.75"/>
              <circle cx="2.3" cy="9.7" r="1.75"/>
              <circle cx="9.7" cy="9.7" r="1.75"/>
              <path d="M3.6 3.9L8.4 8.1"/>
            </svg>
            <span>DISCUSS A PLAN</span>
          </a>
        </div>
      </main>
    </section>

    <script>
      function updateLayout(){
        var u = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
        document.documentElement.style.setProperty('--u', u);
        document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
      }
      window.addEventListener('resize', updateLayout);
      updateLayout();
    </script>
  </body>
</html>
